name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/purepy ./cmd/purepy
      - run: make python-test service-test syntax-test coverage-test
      - run: bin/purepy check examples/reference_service --no-cache
